name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcm-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Qualify retained-file decoding and HTTP handoff
        run: |
          go test -tags pcm_native -count=1 -v ./internal/regularfile ./internal/pcm
          go test -tags pcm_native -count=1 -v -run PCM ./internal/api

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check module hygiene
        run: go mod tidy -diff

      - name: Check formatting
        run: sh scripts/check-gofmt.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: go test -v ./...
