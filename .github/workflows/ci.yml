name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: ./.github/workflows/coverage.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check module hygiene
        run: go mod tidy -diff
      - uses: extractions/setup-just@v4
      - name: Check formatting
        run: sh scripts/check-gofmt.sh
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  windows-hot-cues:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-audio
      - name: Build native CLI
        run: go build ./cmd/engine-cli
      - name: Vet native cue and decoder packages
        run: go vet ./internal/performance ./internal/audiodecode
      - name: Test native file identity and saved cue lifecycle
        run: go test -v -count=1 ./internal/performance ./internal/audiodecode
