name: Set up cached native audio tools
description: Restore prebuilt FFmpeg binaries or native macOS Homebrew bottles.
runs:
  using: composite
  steps:
    - name: Restore prebuilt FFmpeg cache
      if: runner.os != 'macOS'
      id: ffmpeg-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/ffmpeg
        key: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-
        restore-keys: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-
    - name: Set up prebuilt FFmpeg
      if: runner.os != 'macOS'
      id: ffmpeg
      uses: FedericoCarboni/setup-ffmpeg@8073ccb51e517ed576e6871c7f2360c6de4ebb7c # v3.1 + upstream Node24 runtime fix
    - name: Save versioned FFmpeg cache
      if: runner.os != 'macOS' && steps.ffmpeg-cache.outputs.cache-matched-key != format('ffmpeg-v3-{0}-{1}-{2}', runner.os, runner.arch, steps.ffmpeg.outputs.ffmpeg-version)
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/ffmpeg
        key: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg.outputs.ffmpeg-version }}
    - name: Identify native macOS bottles
      if: runner.os == 'macOS'
      id: homebrew
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        echo "path=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
        echo "version=$(brew info --json=v2 ffmpeg-full | jq -r '.formulae[0].versions.stable')" >> "$GITHUB_OUTPUT"
    - name: Cache native macOS bottle downloads
      if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ${{ steps.homebrew.outputs.path }}
        key: homebrew-ffmpeg-full-${{ runner.arch }}-${{ steps.homebrew.outputs.version }}
        restore-keys: homebrew-ffmpeg-full-${{ runner.arch }}-
    - name: Install native macOS audio tools
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        brew install --force-bottle ffmpeg-full
        echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
    - name: Verify audio tools
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version
