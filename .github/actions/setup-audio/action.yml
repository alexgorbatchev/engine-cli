name: Set up cached native audio tools
description: Restore pinned, verified native FFmpeg and FFprobe archives.
runs:
  using: composite
  steps:
    - name: Identify pinned Linux and Windows audio tools
      if: runner.os != 'macOS'
      id: prebuilt-audio
      shell: bash
      run: exec bash scripts/audio-setup/prebuilt.sh identify
    - name: Cache pinned Linux and Windows audio archive
      if: runner.os != 'macOS'
      id: prebuilt-audio-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.prebuilt-audio.outputs.path }}
        key: ${{ steps.prebuilt-audio.outputs.key }}
    - name: Verify and install Linux and Windows audio tools
      if: runner.os != 'macOS'
      shell: bash
      env:
        AUDIO_CACHE_HIT: ${{ steps.prebuilt-audio-cache.outputs.cache-hit }}
      run: exec bash scripts/audio-setup/prebuilt.sh install
    - name: Identify pinned native macOS audio tools
      if: runner.os == 'macOS'
      id: macos-audio
      shell: bash
      run: exec bash scripts/audio-setup/macos.sh identify
    - name: Cache pinned native macOS audio archives
      if: runner.os == 'macOS'
      id: macos-audio-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.macos-audio.outputs.path }}
        key: ${{ steps.macos-audio.outputs.key }}
    - name: Verify and install native macOS audio tools
      if: runner.os == 'macOS'
      shell: bash
      env:
        AUDIO_CACHE_HIT: ${{ steps.macos-audio-cache.outputs.cache-hit }}
      run: exec bash scripts/audio-setup/macos.sh install
    - name: Verify audio tools
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version
