name: Set up cached native audio tools
description: Restore prebuilt FFmpeg binaries, with pinned and verified native macOS archives.
runs:
  using: composite
  steps:
    - name: Restore prebuilt FFmpeg cache
      if: runner.os != 'macOS'
      id: ffmpeg-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/ffmpeg
        key: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-
        restore-keys: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-
    - name: Set up prebuilt FFmpeg
      if: runner.os != 'macOS'
      id: ffmpeg
      uses: FedericoCarboni/setup-ffmpeg@8073ccb51e517ed576e6871c7f2360c6de4ebb7c # v3.1 + upstream Node24 runtime fix
    - name: Save versioned FFmpeg cache
      if: runner.os != 'macOS' && steps.ffmpeg-cache.outputs.cache-matched-key != format('ffmpeg-v3-{0}-{1}-{2}', runner.os, runner.arch, steps.ffmpeg.outputs.ffmpeg-version)
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/ffmpeg
        key: ffmpeg-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg.outputs.ffmpeg-version }}
    - name: Identify pinned native macOS audio tools
      if: runner.os == 'macOS'
      id: macos-audio
      shell: bash
      run: exec bash scripts/audio-setup/macos.sh identify
    - name: Cache pinned native macOS audio archives
      if: runner.os == 'macOS'
      id: macos-audio-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.macos-audio.outputs.path }}
        key: ${{ steps.macos-audio.outputs.key }}
    - name: Verify and install native macOS audio tools
      if: runner.os == 'macOS'
      shell: bash
      env:
        MACOS_AUDIO_CACHE_HIT: ${{ steps.macos-audio-cache.outputs.cache-hit }}
      run: exec bash scripts/audio-setup/macos.sh install
    - name: Verify audio tools
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version
